# Render Blueprint: Infrastructure as Code for backend service
services:
  - type: web
    name: warehouse-twin-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TWIN_SEED
        value: "42"
      - key: TWIN_DB
        value: /tmp/twin.db
      - key: TWIN_CORS_ORIGINS
        value: https://ware-twin.vercel.app   # Allowed frontend origins (CORS)
      - key: TWIN_TRUSTED_PROXIES
        value: "1"                            # Proxy depth for client IP extraction from X-Forwarded-For
